services:
  postgres:
    image: postgres:16-alpine
    container_name: quotaplane-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotaplane -d quotaplane"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - quotaplane


  redis:
    image: redis:7-alpine
    container_name: quotaplane-redis
    restart: unless-stopped

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - quotaplane


volumes:
  postgres_data:
  redis_data:


networks:
  quotaplane:
    driver: bridge